<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guará Mascote 3D</title>
<style>
  :root { --bg:#f6efe6; --ink:#2a1a14; --muted:#7a5f52; --card:#fffaf4; --line:#e6d6c6; --accent:#d7301f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#1b1412; --ink:#f4e9e1; --muted:#bba597; --card:#261c19; --line:#3d2e29; --accent:#ff5a43; } }
  :root[data-theme="dark"] { --bg:#1b1412; --ink:#f4e9e1; --muted:#bba597; --card:#261c19; --line:#3d2e29; --accent:#ff5a43; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.render { background:#000; overflow:hidden; }
  .wrap { max-width:1000px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns: minmax(0,420px) minmax(0,1fr); align-items:start; }
  @media (max-width:760px) { .wrap { grid-template-columns: minmax(0,1fr); } }
  .stage { position:relative; width:100%; aspect-ratio:9/16; border-radius:18px; overflow:hidden; background:#e88a4a; }
  .stage canvas { width:100% !important; height:100% !important; display:block; }
  .cap { position:absolute; left:6%; right:6%; bottom:6%; text-align:center; font-weight:800; font-size:clamp(15px,4.4vw,22px); line-height:1.25; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.6); pointer-events:none; }
  body.render .wrap { display:block; padding:0; max-width:none; }
  body.render .stage { width:1080px; height:1920px; aspect-ratio:auto; border-radius:0; }
  body.render .panel, body.render .cap { display:none; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; display:grid; gap:12px; }
  h1 { margin:0; font-size:22px; } p { margin:0; color:var(--muted); line-height:1.5; }
  textarea { width:100%; min-height:150px; resize:vertical; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:12px; font:inherit; font-size:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  button { border:0; border-radius:999px; padding:12px 18px; font:inherit; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; }
  button.sec { background:transparent; color:var(--ink); border:1px solid var(--line); }
  select { border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); padding:10px; font:inherit; max-width:100%; }
  .note { font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage"><div class="cap" id="cap"></div></div>
  <div class="panel">
    <h1>Guará, o mascote</h1>
    <p>Escreva o texto e clique em <b>Narrar</b>: o guará fala, mexe o bico e bate as asas.</p>
    <textarea id="txt">Olá, Maranhão! Eu sou o Guará, o mascote do mandato do deputado Cláudio Cunha. Sou a ave vermelha mais bonita do nosso litoral, e moro nos manguezais aqui da nossa região. Bora voar junto com a gente!</textarea>
    <div class="row">
      <button id="speak">Narrar</button>
      <button class="sec" id="stop">Parar</button>
      <button class="sec" id="flap">Bater asas</button>
    </div>
    <select id="voice"></select>
    <p class="note">A voz desta página é a do seu navegador. A voz dos vídeos é outra, de melhor qualidade.</p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const RENDER = location.hash.includes('render');
if (RENDER) document.body.classList.add('render');
const stage = document.getElementById('stage');
const W = RENDER ? 1080 : stage.clientWidth, H = RENDER ? 1920 : stage.clientHeight;

const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(RENDER ? 1 : Math.min(2, devicePixelRatio));
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(34, W/H, 0.1, 400);
camera.position.set(0, 3.0, 12.2);
camera.lookAt(0, 2.15, 0);

// ---------- céu de fim de tarde ----------
(function sky(){
  const c = document.createElement('canvas'); c.width = 16; c.height = 512;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#2a64b0'); gr.addColorStop(0.35,'#6f9fd6'); gr.addColorStop(0.55,'#f7b27a'); gr.addColorStop(0.72,'#ff9a52'); gr.addColorStop(1,'#ffd890');
  g.fillStyle = gr; g.fillRect(0,0,16,512);
  const tex = new THREE.CanvasTexture(c); tex.encoding = THREE.sRGBEncoding;
  const sph = new THREE.Mesh(new THREE.SphereGeometry(200, 32, 32), new THREE.MeshBasicMaterial({ map:tex, side:THREE.BackSide, fog:false }));
  scene.add(sph);
  const sun = new THREE.Mesh(new THREE.CircleGeometry(9, 48), new THREE.MeshBasicMaterial({ color:0xfff1c9, fog:false }));
  sun.position.set(-26, 22, -150); scene.add(sun);
  const glow = new THREE.Mesh(new THREE.CircleGeometry(18, 48), new THREE.MeshBasicMaterial({ color:0xffd79a, transparent:true, opacity:.35, fog:false }));
  glow.position.set(-26, 22, -151); scene.add(glow);
})();
scene.fog = new THREE.Fog(0xf3b98a, 30, 140);

// luzes
scene.add(new THREE.HemisphereLight(0xffe2c4, 0x5a3a2a, 0.75));
const key = new THREE.DirectionalLight(0xfff0dc, 1.35);
key.position.set(-6, 10, 8); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left:-6, right:6, top:8, bottom:-4, near:1, far:40 });
key.shadow.bias = -0.0005;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffb07a, 0.9); rim.position.set(5, 5, -8); scene.add(rim);

// ---------- água e mangue ----------
const water = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color:0x6f8fa0, roughness:0.15, metalness:0.35 }));
water.rotation.x = -Math.PI/2; water.position.y = -0.02; scene.add(water);
const sandMat = new THREE.MeshStandardMaterial({ color:0x8a6a4a, roughness:1 });
const bank = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.8, 0.4, 48), sandMat);
bank.scale.z = 0.7; bank.position.set(0, 0.05, 0); bank.receiveShadow = true; scene.add(bank);

const leafMat = new THREE.MeshStandardMaterial({ color:0x2f5a2c, roughness:0.9 });
const leafMat2 = new THREE.MeshStandardMaterial({ color:0x3e6e34, roughness:0.9 });
const rootMat = new THREE.MeshStandardMaterial({ color:0x4a3628, roughness:1 });
function mangrove(x, z, s){
  const g = new THREE.Group();
  for (let i=0;i<7;i++){
    const a = i/7*Math.PI*2 + s;
    const curve = new THREE.QuadraticBezierCurve3(new THREE.Vector3(Math.cos(a)*1.6, 0, Math.sin(a)*1.6), new THREE.Vector3(Math.cos(a)*1.1, 1.8, Math.sin(a)*1.1), new THREE.Vector3(0, 2.4, 0));
    const m = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.07, 6), rootMat); g.add(m);
  }
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.25, 2.5, 8), rootMat); trunk.position.y = 3.4; g.add(trunk);
  for (let i=0;i<9;i++){
    const r = 1.1 + (i%3)*0.35;
    const b = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 12), i%2 ? leafMat : leafMat2);
    b.position.set(Math.sin(i*2.1+s)*1.6, 4.6 + Math.cos(i*1.3)*0.7, Math.cos(i*2.7+s)*1.2);
    g.add(b);
  }
  g.position.set(x, 0, z); g.scale.setScalar(s*0.35+0.9); scene.add(g);
}
[[-9,-14,1.2],[-15,-22,2.1],[-5,-26,0.7],[7,-16,1.6],[13,-24,2.8],[19,-30,0.4],[-22,-34,3.1],[2,-38,1.9],[26,-40,1.1],[-30,-46,2.2]].forEach(a=>mangrove(...a));

// guarás distantes voando
const flock = [];
const flockMat = new THREE.MeshBasicMaterial({ color:0xd6402c });
for (let i=0;i<6;i++){
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 6), flockMat); b.scale.set(1,0.6,2); g.add(b);
  const wl = new THREE.Mesh(new THREE.PlaneGeometry(0.9, 0.22), new THREE.MeshBasicMaterial({ color:0xd6402c, side:THREE.DoubleSide })); wl.geometry.translate(0.45,0,0);
  const wr = wl.clone(); wr.rotation.y = Math.PI;
  g.add(wl); g.add(wr); g.userData = { wl, wr, off:i*1.7, y:9+i%3*1.6, z:-30-i*4 };
  scene.add(g); flock.push(g);
}

// ---------- o guará ----------
const RED = 0xe0341f;
const red = new THREE.MeshStandardMaterial({ color:RED, roughness:0.55, metalness:0.02 });
const redDeep = new THREE.MeshStandardMaterial({ color:0xc42416, roughness:0.6 });
const black = new THREE.MeshStandardMaterial({ color:0x1d1414, roughness:0.5 });
const beakMat = new THREE.MeshStandardMaterial({ color:0x3a2622, roughness:0.35 });
const legMat = new THREE.MeshStandardMaterial({ color:0xe2574a, roughness:0.5 });
const white = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.2 });
const pupilMat = new THREE.MeshStandardMaterial({ color:0x120c0b, roughness:0.15 });
const straw = new THREE.MeshStandardMaterial({ color:0xe9c77b, roughness:0.85 });
const band = new THREE.MeshStandardMaterial({ color:0x1f3f8a, roughness:0.6 });
const tieMat = new THREE.MeshStandardMaterial({ color:0x2457c5, roughness:0.45 });

function shadowAll(o){ o.traverse(m=>{ if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } }); }

// tubo afinado (para bico e pescoço)
function taperTube(points, r0, r1, seg=40, rad=16, mat){
  const curve = new THREE.CatmullRomCurve3(points);
  const geo = new THREE.TubeGeometry(curve, seg, 1, rad, false);
  const pos = geo.attributes.position, v = new THREE.Vector3();
  for (let i=0;i<=seg;i++){
    const u = i/seg, c = curve.getPointAt(u);
    const r = r0 + (r1-r0)*Math.pow(u, 1.1);
    for (let j=0;j<=rad;j++){
      const k = i*(rad+1)+j;
      v.fromBufferAttribute(pos, k).sub(c).multiplyScalar(r).add(c);
      pos.setXYZ(k, v.x, v.y, v.z);
    }
  }
  geo.computeVertexNormals();
  return new THREE.Mesh(geo, mat);
}

const bird = new THREE.Group(); scene.add(bird);
const torso = new THREE.Group(); torso.position.y = 2.15; bird.add(torso);

const body = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 36), red);
body.scale.set(0.78, 0.72, 1.15); body.rotation.x = -0.3; torso.add(body);
const belly = new THREE.Mesh(new THREE.SphereGeometry(0.8, 32, 24), redDeep);
belly.scale.set(0.82, 0.78, 0.9); belly.position.set(0, -0.12, 0.3); torso.add(belly);
// cauda
const tail = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.1, 18), red);
tail.rotation.x = -1.9; tail.position.set(0, -0.35, -1.15); tail.scale.z = 0.5; torso.add(tail);

// pescoço em S
const neckPts = [new THREE.Vector3(0,0.35,0.75), new THREE.Vector3(0,1.0,1.05), new THREE.Vector3(0,1.5,0.7), new THREE.Vector3(0,1.95,0.8)];
const neck = taperTube(neckPts, 0.3, 0.2, 30, 18, red); torso.add(neck);

// cabeça
const headPivot = new THREE.Group(); headPivot.position.set(0, 1.95, 0.8); torso.add(headPivot);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 40, 32), red); head.scale.set(1, 0.95, 1.05); head.position.set(0, 0.28, 0.05); headPivot.add(head);
// face nua (pele mais escura) em volta dos olhos
const face = new THREE.Mesh(new THREE.SphereGeometry(0.4, 28, 20), redDeep); face.scale.set(1.12, 0.75, 0.8); face.position.set(0, 0.24, 0.3); headPivot.add(face);

// olhos grandes de mascote
const eyes = [];
[-1,1].forEach(s=>{
  const eg = new THREE.Group(); eg.position.set(0.25*s, 0.44, 0.48); eg.rotation.y = 0.32*s; headPivot.add(eg);
  const ew = new THREE.Mesh(new THREE.SphereGeometry(0.2, 28, 20), white); ew.scale.z = 0.7; eg.add(ew);
  const pu = new THREE.Mesh(new THREE.SphereGeometry(0.115, 24, 16), pupilMat); pu.position.set(-0.012*s, 0.0, 0.12); pu.scale.z = 0.6; eg.add(pu);
  const hl = new THREE.Mesh(new THREE.SphereGeometry(0.03, 12, 8), new THREE.MeshBasicMaterial({ color:0xffffff })); hl.position.set(0.04, 0.05, 0.19); eg.add(hl);
  const lid = new THREE.Mesh(new THREE.SphereGeometry(0.212, 28, 20, 0, Math.PI*2, 0, Math.PI/2), red); lid.scale.z = 0.75; lid.rotation.x = -1.6; eg.add(lid);
  eyes.push({ eg, lid });
});

// bico longo e curvo: parte de cima e de baixo
const beakPivot = new THREE.Group(); beakPivot.position.set(0, 0.14, 0.55); headPivot.add(beakPivot);
const bp = (y,z)=>new THREE.Vector3(0,y,z);
const upper = taperTube([bp(0.02,0), bp(-0.02,0.55), bp(-0.22,1.05), bp(-0.55,1.45)], 0.13, 0.025, 40, 14, beakMat);
upper.scale.x = 1.1; beakPivot.add(upper);
const lowerPivot = new THREE.Group(); lowerPivot.position.set(0, -0.04, 0.0); beakPivot.add(lowerPivot);
const lower = taperTube([bp(-0.04,0), bp(-0.09,0.5), bp(-0.28,0.98), bp(-0.6,1.36)], 0.1, 0.02, 40, 14, beakMat);
lower.scale.x = 0.95; lowerPivot.add(lower);
const mouthIn = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), new THREE.MeshStandardMaterial({ color:0x7a1f1a })); mouthIn.position.set(0,-0.02,0.08); mouthIn.scale.set(1,0.6,1.6); beakPivot.add(mouthIn);

// chapéu de palha
const hat = new THREE.Group(); hat.position.set(0, 0.8, -0.02); hat.rotation.set(-0.12, 0, 0.1); headPivot.add(hat);
const brim = new THREE.Mesh(new THREE.CylinderGeometry(0.95, 1.0, 0.05, 48), straw); hat.add(brim);
const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.5, 0.42, 40), straw); crown.position.y = 0.22; hat.add(crown);
const crownTop = new THREE.Mesh(new THREE.SphereGeometry(0.42, 32, 12, 0, Math.PI*2, 0, Math.PI/2), straw); crownTop.scale.y = 0.25; crownTop.position.y = 0.43; hat.add(crownTop);
const hb = new THREE.Mesh(new THREE.CylinderGeometry(0.505, 0.51, 0.1, 40, 1, true), band); hb.position.y = 0.08; hat.add(hb);

// gravata borboleta azul
const tie = new THREE.Group(); tie.position.set(0, 0.55, 1.28); tie.rotation.x = 0.15; torso.add(tie);
[-1,1].forEach(s=>{ const c = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.32, 20), tieMat); c.rotation.z = s*Math.PI/2; c.position.x = 0.15*s; c.scale.z = 0.5; tie.add(c); });
const knot = new THREE.Mesh(new THREE.SphereGeometry(0.075, 16, 12), tieMat); tie.add(knot);

// asas
function makeWing(s){
  const shoulder = new THREE.Group(); shoulder.position.set(0.62*s, 0.3, 0.35); torso.add(shoulder);
  const arm = new THREE.Group(); shoulder.add(arm);
  const cov = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 20), red); cov.scale.set(0.95, 0.16, 0.55); cov.position.set(0.85*s, 0, 0); arm.add(cov);
  const hand = new THREE.Group(); hand.position.set(1.65*s, 0, 0); arm.add(hand);
  const cov2 = new THREE.Mesh(new THREE.SphereGeometry(1, 28, 16), red); cov2.scale.set(0.75, 0.13, 0.48); cov2.position.set(0.55*s, 0, -0.05); hand.add(cov2);
  // penas primárias de ponta preta
  for (let i=0;i<5;i++){
    const f = new THREE.Group(); f.position.set((0.75+i*0.12)*s, 0, 0.25-i*0.16); f.rotation.y = -s*(0.15+i*0.17); hand.add(f);
    const fr = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), red); fr.scale.set(0.45, 0.05, 0.12); fr.position.x = 0.3*s; f.add(fr);
    const fb = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 10), black); fb.scale.set(0.38, 0.055, 0.11); fb.position.x = 0.75*s; f.add(fb);
  }
  return { shoulder, arm, hand, s };
}
const wings = [makeWing(-1), makeWing(1)];

// pernas
[-1,1].forEach(s=>{
  const thigh = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.06, 1.0, 12), legMat); thigh.position.set(0.28*s, 1.25, 0.05); thigh.rotation.x = 0.12; bird.add(thigh);
  const shin = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.9, 12), legMat); shin.position.set(0.28*s, 0.65, -0.0); shin.rotation.x = -0.12; bird.add(shin);
  const knee = new THREE.Mesh(new THREE.SphereGeometry(0.085, 12, 10), legMat); knee.position.set(0.28*s, 0.73+0.4, 0.0); bird.add(knee);
  for (let k=-1;k<=1;k++){ const t = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.03, 0.55, 8), legMat); t.rotation.x = Math.PI/2; t.rotation.z = k*0.45; t.position.set(0.28*s + Math.sin(k*0.45)*0.24, 0.26, 0.24); bird.add(t); }
});
shadowAll(bird);
scene.traverse(o=>{ const m=o.material; if(m && m.color && !m.map && !m.userData.lin){ m.color.convertSRGBToLinear(); m.userData.lin=1; } });
scene.fog.color.convertSRGBToLinear();
bird.position.y = 0.0;

// ---------- animação ----------
let flapUntil = -1, flapStart = -1;
function wingPose(w, t, open){
  const s = w.s, k = 1-open;
  const flap = Math.sin(t*13);
  // fechada: asa em pé, colada ao corpo, apontando para trás; aberta: estendida e batendo
  w.arm.rotation.set(k*1.45, 0, 0); w.arm.scale.setScalar(0.62 + 0.38*open);
  w.shoulder.rotation.set(0, s*(1.5*k + 0.35*open), -s*0.35*k + open*s*(0.25 + 0.75*flap));
  w.hand.rotation.set(0, s*0.12*k, open*s*0.45*flap);
}
const smooth = x => x<=0?0:x>=1?1:x*x*(3-2*x);

// mouth: 0..1 ; gest: lista de [início, fim] de batidas de asa
let gestures = [[0.0,1.6],[23.2,25.8]];
function renderAt(t, mouth){
  // respiração e balanço
  const breathe = Math.sin(t*2.2)*0.03;
  torso.position.y = 2.15 + breathe;
  torso.rotation.z = Math.sin(t*0.9)*0.03;
  bird.rotation.y = 0.55 + Math.sin(t*0.5)*0.1;
  // cabeça acompanha a fala
  headPivot.rotation.x = -0.08 + Math.sin(t*1.7)*0.06 - mouth*0.12;
  headPivot.rotation.z = Math.sin(t*1.1)*0.09;
  headPivot.rotation.y = -0.35 + Math.sin(t*0.7)*0.15;
  lowerPivot.rotation.x = mouth*0.42;
  upper.rotation.x = -mouth*0.08;
  // piscar
  const bp = (t % 3.7);
  const blink = bp < 0.14 ? Math.sin(bp/0.14*Math.PI) : 0;
  eyes.forEach(e=>{ e.lid.rotation.x = -1.6 + blink*1.45; });
  // asas
  let open = 0;
  for (const [a,b] of gestures){ if (t>a-0.3 && t<b+0.35){ open = Math.max(open, smooth((t-(a-0.3))/0.3) * smooth(((b+0.35)-t)/0.35)); } }
  if (flapUntil > 0){ open = Math.max(open, smooth((t-flapStart)/0.3)*smooth((flapUntil-t)/0.35)); }
  // pequenas batidas expressivas durante a fala
  const twitch = mouth>0.15 ? 0.08*Math.max(0,Math.sin(t*3.1)) : 0;
  wings.forEach(w=>wingPose(w, t, Math.min(1, open + twitch)));
  torso.position.y += open*Math.max(0,Math.sin(t*14))*0.06;
  // bando ao fundo
  flock.forEach(g=>{ const u = g.userData; const x = ((t*2.2 + u.off*9) % 70) - 35; g.position.set(x, u.y + Math.sin(t+u.off)*0.4, u.z); g.rotation.y = Math.PI/2; const f = Math.sin(t*9+u.off)*0.7; u.wl.rotation.x = f; u.wr.rotation.x = -f; });
  renderer.render(scene, camera);
}
window.renderAt = renderAt;
window.setGestures = g => { gestures = g; };

// ---------- modo interativo (navegador) ----------
if (!RENDER){
  const cap = document.getElementById('cap');
  let speaking = false, lastBoundary = -10, t0 = performance.now();
  const now = ()=> (performance.now()-t0)/1000;
  gestures = [[0.3,1.8]];
  function loop(){
    const t = now();
    let mouth = 0;
    if (speaking){ const since = t - lastBoundary; mouth = Math.max(0, Math.min(1, 0.55 + 0.45*Math.sin(t*22))) * (since < 0.6 ? 1 : 0.6); }
    renderAt(t, mouth);
    requestAnimationFrame(loop);
  }
  loop();
  const sel = document.getElementById('voice');
  function voices(){
    const vs = (speechSynthesis.getVoices()||[]).filter(v=>/^pt/i.test(v.lang));
    sel.innerHTML = vs.map((v,i)=>`<option value="${i}">${v.name} (${v.lang})</option>`).join('') || '<option>Voz padrão do navegador</option>';
    sel._vs = vs;
  }
  if ('speechSynthesis' in window){ voices(); speechSynthesis.onvoiceschanged = voices; }
  document.getElementById('speak').onclick = ()=>{
    if (!('speechSynthesis' in window)) { cap.textContent = 'Este navegador não tem voz.'; return; }
    speechSynthesis.cancel();
    const text = document.getElementById('txt').value.trim(); if (!text) return;
    const u = new SpeechSynthesisUtterance(text); u.lang = 'pt-BR'; u.rate = 1.02;
    const v = sel._vs && sel._vs[+sel.value]; if (v) u.voice = v;
    const t = now(); flapStart = t; flapUntil = t + 1.6;
    u.onstart = ()=>{ speaking = true; lastBoundary = now(); };
    u.onboundary = e=>{ lastBoundary = now(); const rest = text.slice(e.charIndex); const m = text.slice(0, e.charIndex).match(/[^.!?]*$/); const sentence = (m?m[0]:'') + (rest.match(/^[^.!?]*[.!?]?/)||[''])[0]; cap.textContent = sentence.trim(); };
    u.onend = ()=>{ speaking = false; cap.textContent = ''; const t2 = now(); flapStart = t2; flapUntil = t2 + 1.4; };
    speechSynthesis.speak(u);
  };
  document.getElementById('stop').onclick = ()=>{ speechSynthesis.cancel(); speaking = false; cap.textContent=''; };
  document.getElementById('flap').onclick = ()=>{ const t = now(); flapStart = t; flapUntil = t + 1.6; };
  addEventListener('resize', ()=>{ const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w,h); camera.aspect = w/h; camera.updateProjectionMatrix(); });
}
</script>
</body>
</html>
